<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ParTrack</title>
  <style>
    :root { --green:#2f6b43; --ink:#1c211d; --muted:#5f655d; --line:#e3e7e0; --bg:#f7f9f5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card { max-width: 460px; width: 100%; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 15px; background: var(--green);
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .mark svg { width: 30px; height: 30px; }
    h1 { font-size: 30px; margin: 0 0 4px; color: var(--green); letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 16px; margin: 0 0 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block; padding: 14px 18px; border-radius: 12px; text-decoration: none;
      border: 1px solid var(--line); color: var(--ink); font-weight: 500; background: #fff;
    }
    a.btn:hover { border-color: var(--green); }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e8ebe6; --muted:#9aa197; --line:#2c322b; --bg:#14170f; }
      a.btn { background: #1c2118; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
    </span>
    <h1>ParTrack</h1>
    <p>A golf round tracker for everyday players.</p>
    <div class="links">
      <a class="btn" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./terms.html">Terms of Service</a>
    </div>
    <footer>© 2026 ParTrack</footer>
  </div>
</body>
</html>
